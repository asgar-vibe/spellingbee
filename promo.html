<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spelling Bee Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff6d6;
    --fg: #14093a;
    --muted: #5a4b8a;
    --frame: #14093a;
    --btn: #ffffff;
    --btn-fg: #14093a;
    --accent: #ff3d8b;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14093a; --fg: #ffffff; --muted: #b9aef0; --frame: #ffffff; --btn: #2c1a78; --btn-fg: #ffffff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14093a; --fg: #ffffff; --muted: #b9aef0; --frame: #ffffff; --btn: #2c1a78; --btn-fg: #ffffff;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "Fredoka", system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", sans-serif;
  }
  main { max-width: 1000px; margin: 0 auto; padding: 20px 16px 36px; }
  h1 { font-size: 1.2rem; margin: 0 0 14px; font-weight: 700; }
  .stage {
    border: 4px solid var(--frame);
    border-radius: 14px;
    box-shadow: 7px 7px 0 var(--accent);
    background: #14093a;
    overflow: hidden;
    line-height: 0;
  }
  canvas { width: 100%; height: auto; display: block; aspect-ratio: 16 / 9; }
  .controls { display: flex; align-items: center; gap: 10px; margin-top: 26px; flex-wrap: wrap; }
  button {
    font: inherit; font-weight: 700; min-width: 88px; padding: 10px 14px;
    background: var(--btn); color: var(--btn-fg);
    border: 3px solid var(--frame); border-radius: 12px;
    box-shadow: 3px 3px 0 var(--frame); cursor: pointer;
  }
  button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--frame); }
  button:focus-visible, input[type="range"]:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  input[type="range"] { flex: 1 1 160px; min-width: 120px; accent-color: var(--accent); height: 28px; cursor: pointer; }
  .time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.95rem; white-space: nowrap; }
  .note { margin: 20px 0 0; color: var(--muted); font-size: 0.95rem; line-height: 1.6; max-width: 66ch; }
  .note a { color: var(--fg); }
</style>
</head>
<body>
<main>
  <h1>Spelling Bee Challenge: Promo</h1>
  <div class="stage"><canvas id="c" width="1280" height="720" aria-label="Spelling Bee Challenge"></canvas></div>
  <div class="controls">
    <button id="play" type="button">Stop</button>
    <button id="snd" type="button" aria-pressed="false">🔊 Sound: On</button>
    <input id="seek" type="range" min="0" max="2900" value="0" step="1" aria-label="Position">
    <span class="time" id="time">0:00 / 0:29</span>
  </div>
  <p class="note">Join Now at <a href="https://asgar-vibe.github.io/spellingbee/" target="_blank" rel="noopener">Spelling Bee Challenge</a></p>
</main>

<script>
(function () {
  var W = 1280, H = 720, DUR = 29;
  var BOUNDS = [4, 8, 13, 17, 22.5, 25.5];
  var C = { navy: '#14093a', pink: '#ff3d8b', yellow: '#ffd400', cyan: '#00d9ff', violet: '#6a2cff',
            mint: '#2bff9e', orange: '#ff8a1f', white: '#ffffff', blue: '#2f6bff' };
  var DF = '"Lilita One", "Arial Black", sans-serif';
  var BF = '"Fredoka", system-ui, sans-serif';
  var EF = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');

  // ---------- helpers ----------
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function lerp(a, b, p) { return a + (b - a) * p; }
  function easeOut(p) { p = clamp(p, 0, 1); return 1 - Math.pow(1 - p, 3); }
  function easeIO(p) { p = clamp(p, 0, 1); return p * p * (3 - 2 * p); }
  function rnd(i) { var x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
  function pop(t, t0, d) {
    d = d || 0.38;
    var p = (t - t0) / d;
    if (p <= 0) return 0;
    if (p >= 1) return 1;
    var c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2);
  }
  function xf(x, y, s, rot, fn) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot || 0); ctx.scale(s, s); fn(); ctx.restore();
  }
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function card(x, y, w, h, r, fill, stroke, lw, sh, shc) {
    if (sh) { rr(x + sh, y + sh, w, h, r); ctx.fillStyle = shc || C.navy; ctx.fill(); }
    rr(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill();
    if (lw) { ctx.lineWidth = lw; ctx.strokeStyle = stroke || C.navy; ctx.stroke(); }
  }
  function txt(s, x, y, size, color, align, font) {
    ctx.font = size + 'px ' + (font || BF);
    if (!font || font === BF) ctx.font = '700 ' + size + 'px ' + BF;
    ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = color; ctx.fillText(s, x, y);
  }
  function emo(s, x, y, size) {
    ctx.font = size + 'px ' + EF; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#000'; ctx.fillText(s, x, y);
  }
  function sticker(s, x, y, size, fill, outline, shadow, align) {
    ctx.font = size + 'px ' + DF;
    ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round'; ctx.miterLimit = 2;
    var off = Math.max(4, size * 0.07);
    ctx.lineWidth = size * 0.17;
    ctx.strokeStyle = shadow; ctx.fillStyle = shadow;
    ctx.strokeText(s, x + off, y + off); ctx.fillText(s, x + off, y + off);
    ctx.strokeStyle = outline; ctx.strokeText(s, x, y);
    ctx.fillStyle = fill; ctx.fillText(s, x, y);
  }
  function measure(s, size, font) { ctx.font = size + 'px ' + (font || BF); return ctx.measureText(s).width; }

  // ---------- backgrounds ----------
  function bgGrad(c1, c2) {
    var g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, c1); g.addColorStop(1, c2);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  function rays(t, cx, cy, alpha) {
    ctx.fillStyle = 'rgba(255,255,255,' + alpha + ')';
    var n = 18;
    for (var i = 0; i < n; i++) {
      var a0 = t * 0.12 + i * 2 * Math.PI / n, a1 = a0 + Math.PI / n;
      ctx.beginPath(); ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(a0) * 1800, cy + Math.sin(a0) * 1800);
      ctx.lineTo(cx + Math.cos(a1) * 1800, cy + Math.sin(a1) * 1800);
      ctx.closePath(); ctx.fill();
    }
  }
  function hexGrid(t, color, alpha) {
    var r = 64, dx = r * 1.732, dy = r * 1.5;
    var ox = (t * 22) % dx;
    ctx.strokeStyle = color; ctx.globalAlpha = alpha; ctx.lineWidth = 4;
    for (var row = -1; row < H / dy + 2; row++) {
      for (var col = -2; col < W / dx + 2; col++) {
        var x = col * dx + (row % 2 ? dx / 2 : 0) + ox, y = row * dy;
        ctx.beginPath();
        for (var k = 0; k < 6; k++) {
          var a = Math.PI / 6 + k * Math.PI / 3;
          var px = x + Math.cos(a) * (r - 4), py = y + Math.sin(a) * (r - 4);
          if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath(); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }
  function floatLetters(t, alpha) {
    var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    ctx.fillStyle = 'rgba(255,255,255,' + alpha + ')';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (var i = 0; i < 16; i++) {
      var x = rnd(i) * W, sp = 24 + rnd(i + 30) * 34;
      var y = H + 100 - ((t * sp + rnd(i + 60) * (H + 200)) % (H + 200));
      var size = 70 + rnd(i + 90) * 90;
      ctx.font = size + 'px ' + DF;
      xf(x, y, 1, Math.sin(t * 0.8 + i) * 0.4, function () { ctx.fillText(chars[(i * 5) % 26], 0, 0); });
    }
  }
  function confetti(t, t0, ox, oy, n, spread) {
    var dt = t - t0;
    if (dt < 0 || dt > 2.6) return;
    var cols = [C.pink, C.yellow, C.cyan, C.mint, C.white];
    for (var i = 0; i < n; i++) {
      var a = -Math.PI / 2 + (rnd(i) - 0.5) * spread;
      var v = 300 + rnd(i + 50) * 560;
      var x = ox + Math.cos(a) * v * dt, y = oy + Math.sin(a) * v * dt + 760 * dt * dt;
      ctx.save(); ctx.translate(x, y);
      ctx.rotate(rnd(i + 9) * 6 + dt * (4 + rnd(i + 3) * 8));
      ctx.globalAlpha = clamp(1 - (dt - 1.8) / 0.8, 0, 1);
      ctx.fillStyle = cols[i % 5]; ctx.fillRect(-8, -5, 16, 10);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- mascot ----------
  function ell(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); }
  function bee(x, y, s, rot, t) {
    xf(x, y, s, rot, function () {
      var fl = Math.sin(t * 46) * 0.38;
      ctx.lineWidth = 5; ctx.strokeStyle = C.navy; ctx.fillStyle = 'rgba(255,255,255,0.88)';
      xf(-14, -44, 1, -0.5 + fl, function () { ell(0, -34, 22, 42); ctx.fill(); ctx.stroke(); });
      xf(18, -44, 1, 0.5 - fl, function () { ell(0, -34, 22, 42); ctx.fill(); ctx.stroke(); });
      // stinger
      ctx.fillStyle = C.navy; ctx.beginPath(); ctx.moveTo(-60, -10); ctx.lineTo(-96, 2); ctx.lineTo(-60, 14); ctx.closePath(); ctx.fill();
      // body
      ell(0, 0, 68, 54); ctx.fillStyle = C.yellow; ctx.fill();
      ctx.save(); ell(0, 0, 68, 54); ctx.clip();
      ctx.fillStyle = C.navy; ctx.fillRect(-46, -60, 18, 120); ctx.fillRect(-12, -60, 18, 120);
      ctx.restore();
      ell(0, 0, 68, 54); ctx.lineWidth = 6; ctx.stroke();
      // face
      var blink = (Math.sin(t * 1.3) > 0.97) ? 0.15 : 1;
      [28, 54].forEach(function (ex) {
        ctx.save(); ctx.translate(ex, -10); ctx.scale(1, blink);
        ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
        ctx.lineWidth = 3; ctx.stroke();
        ctx.beginPath(); ctx.arc(2, 1, 5.5, 0, Math.PI * 2); ctx.fillStyle = C.navy; ctx.fill();
        ctx.beginPath(); ctx.arc(4, -1, 1.8, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
        ctx.restore();
      });
      ctx.beginPath(); ctx.arc(41, 8, 14, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.lineWidth = 4.5; ctx.lineCap = 'round'; ctx.strokeStyle = C.navy; ctx.stroke();
      ctx.globalAlpha = 0.75; ctx.fillStyle = C.pink;
      ctx.beginPath(); ctx.arc(18, 14, 7, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(62, 14, 7, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      // antennae
      ctx.lineWidth = 5; ctx.strokeStyle = C.navy;
      ctx.beginPath(); ctx.moveTo(24, -48); ctx.quadraticCurveTo(14, -78, 24, -92); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(48, -46); ctx.quadraticCurveTo(62, -72, 76, -80); ctx.stroke();
      ctx.fillStyle = C.pink;
      ctx.beginPath(); ctx.arc(24, -93, 8, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(77, -81, 8, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    });
  }

  // ---------- scenes ----------
  function S1(t) {
    bgGrad(C.violet, C.pink); rays(t, 640, 400, 0.08); floatLetters(t, 0.1);
    var p1 = pop(t, 0.3);
    if (p1 > 0) xf(640, 170, p1, -0.03, function () { sticker('THINK YOU CAN', 0, 0, 96, C.white, C.navy, C.cyan); });
    var p2 = pop(t, 1.0, 0.45);
    if (p2 > 0) xf(640, 350, p2, -0.05 + Math.sin(t * 2) * 0.01, function () { sticker('SPELL IT?', 0, 0, 190, C.yellow, C.navy, C.cyan); });
    var p3 = pop(t, 2.8);
    if (p3 > 0) xf(640, 560, p3, 0.02, function () {
      var w = measure('English spelling, made fun', 44) + 70;
      card(-w / 2, -42, w, 84, 42, C.white, C.navy, 6, 7, C.navy);
      txt('English spelling, made fun', 0, 2, 44, C.navy);
    });
    var bp = clamp((t - 2.0) / 1.2, 0, 1), be = easeOut(bp);
    var bx = lerp(-160, 1130, be);
    var by = bp < 1 ? 520 - 320 * be + Math.sin(bp * 14) * 44 * (1 - bp) : 200 + Math.sin(t * 4) * 8;
    if (t > 1.9) bee(bx, by, 1.05, Math.sin(bp * 14) * 0.15 * (1 - bp), t);
  }

  function S2(t) {
    bgGrad(C.yellow, C.orange); hexGrid(t, C.navy, 0.14); floatLetters(t, 0.12);
    var pb = pop(t, 4.15, 0.5);
    if (pb > 0) bee(360, 380 + Math.sin(t * 3) * 14, 2.4 * pb, Math.sin(t * 2) * 0.05, t);
    var lines = [['SPELLING', 190, 120, 4.3], ['BEE', 315, 150, 4.5], ['CHALLENGE', 440, 100, 4.7]];
    lines.forEach(function (l) {
      var p = pop(t, l[3]);
      if (p > 0) xf(660, l[1], p, 0, function () { sticker(l[0], 0, 0, l[2], C.white, C.navy, C.pink, 'left'); });
    });
    var pt = clamp((t - 5.4) / 0.5, 0, 1);
    if (pt > 0) {
      ctx.globalAlpha = pt;
      txt('Master English spelling', 660, 548 + (1 - pt) * 16, 40, C.navy, 'left');
      txt('with native pronunciation', 660, 596 + (1 - pt) * 16, 40, C.navy, 'left');
      ctx.globalAlpha = 1;
    }
    var pp = pop(t, 6.2);
    if (pp > 0) xf(660, 662, pp, -0.02, function () {
      var w = measure('English Vocabulary Practice', 30) + 50;
      card(0, -26, w, 52, 26, C.pink, C.navy, 5, 5, C.navy);
      txt('English Vocabulary Practice', w / 2, 2, 30, C.white);
    });
  }

  var PILLS = [
    { x: 320, y: 270, e: '⚡', n: '10', c: C.yellow },
    { x: 640, y: 270, e: '🎯', n: '20', c: C.pink },
    { x: 960, y: 270, e: '🧠', n: '30', c: '#9d7bff' },
    { x: 480, y: 440, e: '🔥', n: '40', c: C.orange },
    { x: 800, y: 440, e: '👑', n: '50', c: C.mint }
  ];
  function S3(t) {
    bgGrad(C.cyan, C.blue); hexGrid(t, '#ffffff', 0.18); floatLetters(t, 0.08);
    var ph = pop(t, 8.2);
    if (ph > 0) xf(640, 105, ph, -0.02, function () { sticker('PICK YOUR PACE', 0, 0, 92, C.white, C.navy, C.pink); });
    var seq = [0, 1, 3, 4, 2], sel = -1;
    if (t >= 10.0) sel = seq[Math.min(seq.length - 1, Math.floor((t - 10.0) / 0.25))];
    var done = t >= 11.1;
    PILLS.forEach(function (p, i) {
      var s = pop(t, 8.6 + i * 0.22);
      if (s <= 0) return;
      var isSel = (i === sel);
      var sc = s * (isSel ? (done ? 1.08 + Math.sin(t * 8) * 0.015 : 1.05) : 1);
      xf(p.x, p.y, sc, (i % 2 ? 0.02 : -0.02), function () {
        card(-150, -65, 300, 130, 34, p.c, C.navy, 6, 8, C.navy);
        emo(p.e, -95, 0, 60);
        txt(p.n, -40, -10, 72, C.navy, 'left', DF);
        txt('Words', -40, 40, 30, C.navy, 'left');
        if (isSel) { rr(-160, -75, 320, 150, 40); ctx.lineWidth = 8; ctx.strokeStyle = C.white; ctx.stroke(); }
        if (isSel && done) {
          ctx.beginPath(); ctx.arc(138, -62, 24, 0, Math.PI * 2); ctx.fillStyle = C.white; ctx.fill();
          ctx.lineWidth = 5; ctx.strokeStyle = C.navy; ctx.stroke();
          ctx.beginPath(); ctx.moveTo(127, -62); ctx.lineTo(135, -53); ctx.lineTo(150, -72); ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
        }
      });
    });
    var pb = pop(t, 11.6);
    if (pb > 0) xf(640, 600, pb, 0.01, function () { sticker('Quick sprint or full marathon', 0, 0, 58, C.white, C.navy, C.navy); });
  }

  function S4(t) {
    bgGrad(C.pink, C.violet); rays(t, 640, 380, 0.07); floatLetters(t, 0.1);
    var ph = pop(t, 13.2);
    if (ph > 0) xf(640, 100, ph, 0.02, function () { sticker('PICK YOUR LEVEL', 0, 0, 92, C.white, C.navy, C.cyan); });
    var cards = [
      { x: 260, c: C.mint, e: '🟢', l: 'EASY', d1: 'Common everyday', d2: 'words', t0: 13.5, r: -0.05 },
      { x: 640, c: C.yellow, e: '🟡', l: 'MEDIUM', d1: 'Intermediate', d2: 'vocabulary', t0: 13.8, r: 0.0 },
      { x: 1020, c: '#ff5a5a', e: '🔴', l: 'HARD', d1: 'Challenging', d2: 'competition words', t0: 14.1, r: 0.05 }
    ];
    cards.forEach(function (c, i) {
      var p = pop(t, c.t0, 0.5);
      if (p <= 0) return;
      var shake = (i === 2 && t > 15.4) ? Math.sin(t * 40) * 0.02 : 0;
      var lift = Math.sin(t * 2.4 + i) * 6;
      xf(c.x, 420 + (1 - p) * 140 + lift, p, c.r + shake, function () {
        card(-165, -190, 330, 380, 40, c.c, C.navy, 7, 10, C.navy);
        emo(c.e, 0, -105, 96);
        txt(c.l, 0, -10, 64, C.navy, 'center', DF);
        txt(c.d1, 0, 62, 29, C.navy);
        txt(c.d2, 0, 100, 29, C.navy);
        if (i === 2 && t > 15.4) {
          ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t * 14);
          emo('🔥', 120, -165, 52);
          ctx.globalAlpha = 1;
        }
      });
    });
    var pb = pop(t, 15.6);
    if (pb > 0) xf(640, 650, pb, -0.01, function () { sticker('How far can you go?', 0, 0, 62, C.white, C.navy, C.navy); });
  }

  var KROWS = ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'];
  var WORD = 'BEAUTIFUL', T_TYPE = 18.4, STEP = 0.22, T_OK = 20.7;
  function S5(t) {
    bgGrad('#14093a', '#3a1a8c'); floatLetters(t, 0.04);
    // glow blobs
    var g = ctx.createRadialGradient(1050, 120, 10, 1050, 120, 420); g.addColorStop(0, 'rgba(255,61,139,0.45)'); g.addColorStop(1, 'rgba(255,61,139,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    g = ctx.createRadialGradient(200, 700, 10, 200, 700, 420); g.addColorStop(0, 'rgba(0,217,255,0.4)'); g.addColorStop(1, 'rgba(0,217,255,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    var pa = pop(t, 17.2, 0.5);
    if (pa <= 0) return;
    var typed = clamp(Math.floor((t - T_TYPE) / STEP) + 1, 0, WORD.length);
    var ok = t >= T_OK;
    xf(410, 360, pa, 0, function () {
      ctx.translate(-410, -360);
      card(60, 40, 700, 640, 40, '#ffffff', C.navy, 7, 12, C.pink);
      // header
      txt('Word 1 of 10', 100, 86, 32, C.navy, 'left');
      card(435, 62, 150, 46, 23, C.mint, C.navy, 4, 0);
      txt('🟢 EASY', 510, 87, 24, C.navy);
      card(612, 62, 120, 46, 23, C.yellow, C.navy, 4, 0);
      txt('💡 Hint', 672, 87, 24, C.navy);
      card(100, 128, 620, 16, 8, '#e8e3ff', null, 0, 0);
      card(100, 128, 62, 16, 8, C.pink, null, 0, 0);
      // streak and score
      var bump = ok ? 1 + 0.25 * Math.max(0, 1 - (t - T_OK - 0.1) * 4) : 1;
      xf(100, 190, bump, 0, function () { txt(ok ? '🔥 3 Streak!' : '🔥 2 Streak!', 0, 0, 34, C.orange, 'left', DF); });
      xf(720, 190, bump, 0, function () { txt(ok ? '⭐ Score: 30' : '⭐ Score: 20', 0, 0, 34, C.navy, 'right', DF); });
      // speaker
      var sp = 1 + (t > 17.7 && t < 18.5 ? 0.06 * Math.sin(t * 24) : 0);
      if (t > 17.7 && t < 18.7) {
        for (var k = 0; k < 3; k++) {
          var ph = ((t * 1.6) + k / 3) % 1;
          ctx.beginPath(); ctx.arc(410, 280, 56 + ph * 58, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(255,61,139,' + (1 - ph) + ')'; ctx.lineWidth = 6; ctx.stroke();
        }
      }
      xf(410, 280, sp, 0, function () {
        ctx.beginPath(); ctx.arc(0, 0, 56, 0, Math.PI * 2); ctx.fillStyle = C.pink; ctx.fill();
        ctx.lineWidth = 6; ctx.strokeStyle = C.navy; ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.moveTo(-26, -12); ctx.lineTo(-12, -12); ctx.lineTo(8, -30); ctx.lineTo(8, 30); ctx.lineTo(-12, 12); ctx.lineTo(-26, 12); ctx.closePath(); ctx.fill();
        ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.strokeStyle = '#fff';
        ctx.beginPath(); ctx.arc(10, 0, 16, -0.9, 0.9); ctx.stroke();
        ctx.beginPath(); ctx.arc(10, 0, 28, -0.9, 0.9); ctx.stroke();
      });
      // voice pills
      card(210, 352, 190, 46, 23, C.pink, C.navy, 4, 0);
      txt('Female  Press 1', 305, 376, 22, '#fff');
      card(420, 352, 190, 46, 23, '#ffffff', C.navy, 4, 0);
      txt('Male  Press 0', 515, 376, 22, C.navy);
      // input
      card(110, 412, 600, 74, 22, ok ? '#d6ffe9' : '#f4f1ff', ok ? '#0fb36a' : C.navy, 5, 0);
      if (typed === 0) {
        txt('🐝 Type on your keyboard or tap keys below...', 140, 450, 23, '#8a82b8', 'left');
      } else {
        var s = WORD.slice(0, typed);
        for (var i = 0; i < s.length; i++) {
          var lp = pop(t, T_TYPE + i * STEP, 0.2);
          xf(150 + i * 46, 449, Math.max(0.01, lp), 0, function () { txt(s[i], 0, 0, 52, C.navy, 'center', DF); });
        }
        if (!ok && Math.floor(t * 3) % 2 === 0) { ctx.fillStyle = C.pink; ctx.fillRect(150 + typed * 46 - 14, 428, 4, 42); }
        if (ok) txt('✅', 676, 450, 40, C.navy);
      }
      // keyboard
      var starts = [143, 170, 224], ys = [510, 564, 618];
      KROWS.forEach(function (row, r) {
        for (var c = 0; c < row.length; c++) {
          var ch = row[c], kx = starts[r] + c * 54, ky = ys[r];
          var lit = 0;
          for (var j = 0; j < WORD.length; j++) {
            if (WORD[j] === ch) {
              var d = t - (T_TYPE + j * STEP);
              if (d >= 0 && d < 0.28) lit = Math.max(lit, 1 - d / 0.28);
            }
          }
          var press = lit * 4;
          card(kx, ky + press, 48, 48, 10, lit > 0 ? C.pink : '#efeaff', C.navy, 3, lit > 0 ? 0 : 4, '#bdb2f0');
          txt(ch, kx + 24, ky + 25 + press, 24, lit > 0 ? '#fff' : C.navy, 'center', DF);
        }
      });
    });
    // callouts
    var items = [
      { e: '🔊', a: 'Native voices', b: 'Female or male', c: C.pink, t0: 17.6 },
      { e: '⌨️', a: 'Type or tap', b: 'the on-screen keys', c: C.cyan, t0: 18.5 },
      { e: '🔥', a: 'Build your', b: 'streak', c: C.yellow, t0: 19.5 },
      { e: '💡', a: 'Stuck?', b: 'Grab a hint', c: C.mint, t0: 20.3 }
    ];
    items.forEach(function (it, i) {
      var p = pop(t, it.t0, 0.45);
      if (p <= 0) return;
      xf(1020 + (1 - p) * 300, 140 + i * 150, Math.max(0.01, p), (i % 2 ? 0.02 : -0.02), function () {
        card(-220, -60, 440, 120, 30, it.c, C.navy, 6, 8, C.navy);
        emo(it.e, -165, 0, 56);
        txt(it.a, -110, -20, 38, C.navy, 'left', DF);
        txt(it.b, -110, 24, 30, C.navy, 'left');
      });
    });
    var pn = pop(t, T_OK, 0.45);
    if (pn > 0) xf(520, 120, pn, -0.09, function () { sticker('NAILED IT!', 0, 0, 84, C.mint, C.navy, C.pink); });
    confetti(t, T_OK, 410, 300, 70, 2.6);
  }

  function S6(t) {
    bgGrad(C.violet, C.pink); rays(t, 640, 300, 0.09); floatLetters(t, 0.1);
    var ph = pop(t, 22.7);
    if (ph > 0) xf(640, 105, ph, -0.02, function () { sticker('PRACTICE COMPLETE!', 0, 0, 96, C.yellow, C.navy, C.cyan); });
    var pt = pop(t, 22.9, 0.55);
    if (pt > 0) xf(640, 255 + Math.sin(t * 5) * 6, pt, Math.sin(t * 3) * 0.06, function () { emo('🏆', 0, 0, 150); });
    var stats = [
      { x: 280, e: '🎯', v: '10 / 10', l: 'Total Score', c: C.cyan, t0: 23.2 },
      { x: 640, e: '📊', v: 'ACC', l: 'Accuracy', c: C.yellow, t0: 23.4 },
      { x: 1000, e: '🔥', v: '10 words', l: 'Max Streak', c: C.mint, t0: 23.6 }
    ];
    stats.forEach(function (s, i) {
      var p = pop(t, s.t0, 0.45);
      if (p <= 0) return;
      var v = s.v;
      if (v === 'ACC') v = Math.round(100 * easeOut((t - s.t0) / 1.2)) + '%';
      xf(s.x, 470, Math.max(0.01, p), (i - 1) * 0.04, function () {
        card(-150, -95, 300, 190, 32, s.c, C.navy, 6, 8, C.navy);
        emo(s.e, 0, -52, 48);
        txt(v, 0, 10, 62, C.navy, 'center', DF);
        txt(s.l, 0, 62, 28, C.navy);
      });
    });
    var pc = pop(t, 24.3, 0.5);
    if (pc > 0) xf(640, 640, pc, 0.01, function () {
      card(-490, -42, 980, 84, 42, C.white, C.navy, 6, 7, C.navy);
      txt('👑 Crown Achievement! 100% on every single word!', 0, 3, 36, C.navy);
    });
    confetti(t, 22.8, 640, 330, 80, 3.4);
  }

  function S7(t) {
    bgGrad(C.pink, C.violet); rays(t, 640, 360, 0.1); floatLetters(t, 0.1);
    var pb = pop(t, 25.7, 0.5);
    if (pb > 0) bee(640, 160 + Math.sin(t * 4) * 10, 1.5 * pb, Math.sin(t * 2.5) * 0.08, t);
    var ph = pop(t, 26.0);
    if (ph > 0) xf(640, 330, ph, -0.02, function () { sticker('READY TO BUZZ?', 0, 0, 124, C.white, C.navy, C.cyan); });
    var pbtn = pop(t, 26.5, 0.5);
    if (pbtn > 0) {
      var pulse = 1 + Math.sin(t * 6) * 0.03;
      xf(640, 470, pbtn * pulse, 0, function () {
        card(-250, -50, 500, 100, 50, C.yellow, C.navy, 7, 9, C.navy);
        txt('Start Practice', 0, 4, 58, C.navy, 'center', DF);
      });
    }
    var pu = clamp((t - 27.1) / 0.5, 0, 1);
    if (pu > 0) {
      ctx.globalAlpha = pu;
      txt('asgar-vibe.github.io/spellingbee', 640, 592, 44, '#ffffff', 'center');
      txt('Developed by Akira Waewbandhit (ASGAR)', 640, 650, 28, '#ffd6ea', 'center');
      ctx.globalAlpha = 1;
    }
  }

  function wipe(t) {
    var cols = [C.pink, C.yellow, C.cyan];
    BOUNDS.forEach(function (b) {
      var p = (t - (b - 0.45)) / 0.9;
      if (p <= 0 || p >= 1) return;
      for (var i = 2; i >= 0; i--) {
        var q = clamp((p - i * 0.04) / 0.92, 0, 1);
        var e = -300 + (W + 700) * easeIO(clamp(q * 2, 0, 1));
        var a = -300 + (W + 700) * easeIO(clamp(q * 2 - 1, 0, 1));
        ctx.fillStyle = cols[i];
        ctx.beginPath(); ctx.moveTo(a, 0); ctx.lineTo(e, 0); ctx.lineTo(e - 200, H); ctx.lineTo(a - 200, H); ctx.closePath(); ctx.fill();
      }
    });
  }

  function render(t) {
    var s = 0;
    for (var i = 0; i < BOUNDS.length; i++) if (t >= BOUNDS[i]) s = i + 1;
    ctx.clearRect(0, 0, W, H);
    ctx.lineCap = 'butt'; ctx.lineJoin = 'miter';
    [S1, S2, S3, S4, S5, S6, S7][s](t);
    wipe(t);
    if (t < 0.25) { ctx.fillStyle = 'rgba(20,9,58,' + (1 - t / 0.25) + ')'; ctx.fillRect(0, 0, W, H); }
  }

  // ---------- sound ----------
  var AC = null, soundOn = false;
  function tone(f, d, type, vol, delay, f2) {
    var t0 = AC.currentTime + (delay || 0);
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(f, t0);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + d);
    g.gain.setValueAtTime(vol || 0.06, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + d + 0.02);
  }
  function sfx(type) {
    if (!soundOn || !AC) return;
    try {
      if (type === 'pop') tone(500, 0.12, 'triangle', 0.12, 0, 900);
      else if (type === 'big') { tone(300, 0.2, 'triangle', 0.14, 0, 800); tone(600, 0.2, 'square', 0.05, 0.05, 1200); }
      else if (type === 'key') tone(900 + Math.random() * 200, 0.05, 'square', 0.04);
      else if (type === 'buzz') tone(190, 1.1, 'sawtooth', 0.04, 0, 260);
      else if (type === 'ok') [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.18, 'square', 0.06, i * 0.09); });
      else if (type === 'ding') tone(1200, 0.25, 'sine', 0.1, 0, 1600);
    } catch (e) {}
  }
  var EV = [];
  function ev(t, k) { EV.push({ t: t, k: k }); }
  ev(0.3, 'pop'); ev(1.0, 'big'); ev(2.0, 'buzz'); ev(2.8, 'pop');
  ev(4.15, 'big'); ev(4.3, 'pop'); ev(4.5, 'pop'); ev(4.7, 'pop'); ev(6.2, 'pop');
  ev(8.2, 'pop'); for (var a = 0; a < 5; a++) ev(8.6 + a * 0.22, 'pop');
  for (var b = 0; b < 5; b++) ev(10.0 + b * 0.25, 'key'); ev(11.1, 'ding'); ev(11.6, 'pop');
  ev(13.2, 'pop'); ev(13.5, 'pop'); ev(13.8, 'pop'); ev(14.1, 'pop'); ev(15.6, 'big');
  ev(17.2, 'pop'); ev(17.6, 'pop'); ev(17.7, 'ding'); ev(18.5, 'pop'); ev(19.5, 'pop'); ev(20.3, 'pop');
  for (var c = 0; c < 9; c++) ev(18.4 + c * 0.22, 'key'); ev(20.7, 'ok');
  ev(22.7, 'big'); ev(22.9, 'pop'); ev(23.2, 'pop'); ev(23.4, 'pop'); ev(23.6, 'pop'); ev(24.3, 'ding');
  ev(25.7, 'pop'); ev(26.0, 'big'); ev(26.5, 'pop');

  // ---------- player ----------
  var playBtn = document.getElementById('play');
  var sndBtn = document.getElementById('snd');
  var seek = document.getElementById('seek');
  var timeEl = document.getElementById('time');
  var t = 0, prevT = 0, playing = true, last = performance.now(), dragging = false;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;

  function fmt(s) { var m = Math.floor(s / 60), r = Math.floor(s % 60); return m + ':' + (r < 10 ? '0' : '') + r; }
  function syncUI() {
    playBtn.textContent = playing ? 'Stop' : (t >= DUR ? 'Repeat' : 'Play');
    if (!dragging) seek.value = Math.round(t * 100);
    timeEl.textContent = fmt(t) + ' / ' + fmt(DUR);
  }
  playBtn.addEventListener('click', function () {
    if (t >= DUR) { t = 0; prevT = 0; }
    playing = !playing; last = performance.now(); syncUI();
  });
  sndBtn.addEventListener('click', function () {
    soundOn = !soundOn;
    if (soundOn) {
      try {
        if (!AC) { var Ctor = window.AudioContext || window.webkitAudioContext; if (Ctor) AC = new Ctor(); }
        if (AC && AC.state === 'suspended') AC.resume();
        sfx('ding');
      } catch (e) {}
    }
    sndBtn.textContent = soundOn ? '🔊 Sound: On' : '🔊 Sound: Off';
    sndBtn.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
  });
  seek.addEventListener('input', function () {
    dragging = true; t = clamp(seek.value / 100, 0, DUR); prevT = t; syncUI();
  });
  seek.addEventListener('change', function () { dragging = false; prevT = t; syncUI(); });

  function frame(now) {
    var dt = (now - last) / 1000; last = now;
    if (playing) {
      t += Math.min(dt, 0.1);
      if (t >= DUR) { t = DUR; playing = false; }
      if (soundOn) {
        for (var i = 0; i < EV.length; i++) if (EV[i].t > prevT && EV[i].t <= t) sfx(EV[i].k);
      }
    }
    prevT = t;
    render(t);
    syncUI();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
